<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IA Escolar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">🤖</div>

      <div>
        <h1>IA Escolar</h1>
        <p id="status">IA pronta para ajudar</p>
      </div>
    </header>

    <main id="chat">

      <div class="message ai">
        Olá! 👋<br><br>
        Sou a IA Escolar. Posso ajudar com Matemática,
        História, Ciências, Português e outras matérias.
        <br><br>
        📷 Você também pode enviar uma foto de uma questão.
      </div>

    </main>

    <div class="input-area">

      <!-- Botão para escolher foto -->
      <button
        id="imageButton"
        type="button"
        title="Enviar foto"
      >
        📷
      </button>

      <!-- Campo de seleção da imagem -->
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
      >

      <!-- Campo da pergunta -->
      <input
        type="text"
        id="messageInput"
        placeholder="Digite sua pergunta..."
        autocomplete="off"
      >

      <!-- Botão enviar -->
      <button
        id="sendButton"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
