<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Escolar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">🤖</div>
      <div>
        <h1>IA Escolar</h1>
        <p>Seu assistente de estudos</p>
      </div>
    </header>

    <main id="chat">
      <div class="message ai">
        Olá! 👋<br><br>
        Sou sua IA Escolar. Posso ajudar com Matemática,
        História, Ciências, Português e outras matérias.
      </div>
    </main>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Digite sua pergunta..."
        autocomplete="off"
      >

      <button id="sendButton">➤</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
